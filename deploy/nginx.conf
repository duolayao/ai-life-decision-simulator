# AI 人生决策模拟器 - Nginx 配置（安全加固版）
#
# 部署路径：/etc/nginx/sites-available/ai-life-decision-simulator
# 启用：ln -s /etc/nginx/sites-available/ai-life-decision-simulator /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name 111.229.123.144 localhost;

    # 静态资源根目录
    root /var/www/ai-life-decision-simulator;
    index index.html;

    # 上传文件大小限制（POST 请求 body）
    client_max_body_size 4m;

    # gzip 压缩（大幅减小 JS 传输体积，从 350K 压到 ~120K）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml text/javascript;
    gzip_comp_level 6;

    # ==================== 安全加固配置 ====================

    # 禁止访问隐藏文件（如 .git, .env 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问常见敏感文件
    location ~* \.(sql|bak|backup|old|swp|tmp|log|ini|conf|yml|yaml|xml|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问常见后端脚本（即使没有后端，防扫描器）
    location ~* \.(php|jsp|asp|aspx|py|pl|cgi|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 防止目录遍历攻击
    location ~* \.\./ {
        deny all;
    }

    # 限制请求方法（只允许 GET 和 POST）
    if ($request_method !~ ^(GET|POST|HEAD)$) {
        return 405;
    }

    # 禁用 TRACE 方法（防止 Cross-Site Tracing 攻击）
    if ($request_method = TRACE) {
        return 405;
    }

    # ==================== 静态资源缓存 ====================
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==================== API 反向代理 ====================
    location /api/deepseek/ {
        # 基础限流：单 IP 每秒最多 10 个请求
        limit_req zone=api_limit burst=20 nodelay;

        # 去掉 /api/deepseek 前缀，转发到 DeepSeek 官方
        rewrite ^/api/deepseek/(.*)$ /$1 break;

        proxy_pass https://api.deepseek.com;
        proxy_http_version 1.1;
        proxy_set_header Host api.deepseek.com;
        proxy_set_header Connection "";

        # ★ 在这里注入 API Key，前端永远不会看到
        proxy_set_header Authorization "Bearer sk-cca9931dd9424c4ca4c50bcb1bfa5580";

        # 转发请求体（支持 POST + JSON）
        proxy_pass_request_body on;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $content_length;

        # 超时设置（reasoning 模型响应较慢，给 90s）
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # SSL 配置（DeepSeek 用 HTTPS）
        proxy_ssl_server_name on;
        proxy_ssl_name api.deepseek.com;

        # API 日志（便于监控异常）
        access_log /var/log/nginx/deepseek-api.log;
    }

    # ==================== 50x 错误页面 ====================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ==================== SPA 路由回退 ====================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================== 安全响应头 ====================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

# ==================== 限流区域定义 ====================
# 必须在 server 块外定义
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;